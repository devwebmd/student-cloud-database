<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cloud Database</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #24b47e; 
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #1c8c60;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .btn-delete {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 14px;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Cloud Database</h2>
    
    <form id="studentForm">
        <div class="form-group">
            <label for="studentCode">Mã sinh viên:</label>
            <input type="text" id="studentCode" required placeholder="Nhập MSV (Ví dụ: PH12345)">
        </div>
        <div class="form-group">
            <label for="fullName">Họ và tên:</label>
            <input type="text" id="fullName" required placeholder="Nhập họ và tên">
        </div>
        <div class="form-group">
            <label for="className">Tên lớp:</label>
            <input type="text" id="className" required placeholder="Nhập tên lớp (Ví dụ: K28-Cloud)">
        </div>
        <button type="submit">Thêm Sinh Viên</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ và Tên</th>
                <th>Lớp</th>
                <th>Ngày tạo</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            </tbody>
    </table>
</div>

<script>
    // 1. CẤU HÌNH KẾT NỐI SUPABASE
    const SUPABASE_URL = "https://yvqmpxrbpgphicksgyly.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_g5CNFqn3PtLw4taee3ihmg_MDFFmCYc";

    // Khởi tạo một đối tượng kết nối với tên biến là supabaseClient
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Khai báo các biến DOM tương tác giao diện
    const studentForm = document.getElementById('studentForm');
    const studentTableBody = document.getElementById('studentTableBody');

    // 2. CHỨC NĂNG ĐỌC DỮ LIỆU (READ)
    async function fetchStudents() {
        const { data, error } = await supabaseClient
            .from('students')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Lỗi lấy dữ liệu từ Cloud:', error.message);
            return;
        }

        // Làm sạch dữ liệu cũ hiển thị trên bảng HTML
        studentTableBody.innerHTML = '';

        // Đổ mảng dữ liệu mới trả về từ database vào bảng
        if (data) {
            data.forEach(student => {
                const row = document.createElement('tr');
                const date = new Date(student.created_at).toLocaleString('vi-VN');

                row.innerHTML = `
                    <td>${student.student_code}</td>
                    <td>${student.full_name}</td>
                    <td>${student.class_name}</td>
                    <td>${date}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteStudent(${student.id})">Xóa</button>
                    </td>
                `;
                studentTableBody.appendChild(row);
            });
        }
    }

    // 3. CHỨC NĂNG THÊM DỮ LIỆU (CREATE)
    studentForm.addEventListener('submit', async (e) => {
        e.preventDefault(); 

        const studentCode = document.getElementById('studentCode').value;
        const fullName = document.getElementById('fullName').value;
        const className = document.getElementById('className').value;

        const { data, error } = await supabaseClient
            .from('students')
            .insert([
                { 
                    student_code: studentCode, 
                    full_name: fullName, 
                    class_name: className 
                }
            ]);

        if (error) {
            alert('Lỗi gửi dữ liệu lên database: ' + error.message);
        } else {
            alert('Thêm sinh viên thành công lên Cloud!');
            studentForm.reset(); 
            fetchStudents(); // Cập nhật lại danh sách tự động
        }
    });

    // 4. CHỨC NĂNG XÓA DỮ LIỆU (DELETE)
    async function deleteStudent(id) {
        if (confirm('Bạn có chắc chắn muốn xóa sinh viên này không?')) {
            const { error } = await supabaseClient
                .from('students')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Lỗi hệ thống khi xóa dữ liệu: ' + error.message);
            } else {
                alert('Xóa thành công khỏi cơ sở dữ liệu!');
                fetchStudents(); 
            }
        }
    }

    // Lắng nghe sự kiện trang web tải xong để tự động render bảng
    window.onload = fetchStudents;
</script>

</body>
</html>
